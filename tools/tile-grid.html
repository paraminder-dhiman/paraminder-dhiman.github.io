<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Tile grid · Behind the site image</title>
<!--
  Builds the "every tile as line art and render" image used on the Behind the Site page.

  It reads the project list from js/projects.js, so the tiles always come out in the same
  groups and order as the tile rail. Each tile shows its line art (tiles/<id>-dark.svg) beside
  its render (tiles/<id>-dark.jpg). Add ?theme=light to the address for the light version.

  How to make the image
    1. In the portfolio folder run:  python -m http.server 8000
    2. Open http://localhost:8000/tools/tile-grid.html in Chrome
       (and http://localhost:8000/tools/tile-grid.html?theme=light for the light one)
    3. Right-click the grid > Inspect, then click the <div class="grid"> line in the Elements panel
    4. Press Ctrl+Shift+P, type "node screenshot" and choose Capture node screenshot
    5. Chrome saves a PNG. Open it in Photoshop, set Image > Image Size to 1600 pixels wide,
       and save it as images/behind-the-site/tiles-grid-dark.jpg, or tiles-grid-light.jpg
       for the light one (JPEG quality 10)
    6. If the height changed, update the height="" on the image in behind-the-site.html
-->
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("../fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
  /* the site's colours for each theme */
  :root { --ground: #212f3a; --text: #c9d0cf; --muted: #a9b4b6; --hair: #3d4e59; --rule: #8a979b; }
  :root.light { --ground: #eef0ec; --text: #34434d; --muted: #4a575e; --hair: #d3d9d8; --rule: #76838a; }
  body { margin: 0; background: var(--ground); font: 500 22px "IBM Plex Sans", sans-serif; color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 36px; padding: 28px; width: 1544px; background: var(--ground); }
  .group { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin-top: 8px;
           font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .group::after { content: ""; flex: 1; border-top: 1.5px solid var(--hair); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { aspect-ratio: 1; border: 1.5px solid var(--rule); }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tile.line img { opacity: 0.85; }
  .pair p { grid-column: 1 / 3; margin: 2px 0 0; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script src="../js/projects.js"></script>
<script>
  var THEME = /theme=light/.test(location.search) ? "light" : "dark";
  if (THEME === "light") document.documentElement.className = "light";
  function themed(file) { return file.replace(/(\.\w+)$/, "-" + THEME + "$1"); }

  // The same "Me" group and ordering as js/site.js: group, then pin, then size, then year.
  var me = [{ id: "about", tile: "About" }, { id: "contact", tile: "Contact" }];
  var live = PROJECTS.filter(function (p) { return p.status === "live"; }).sort(function (a, b) {
    return GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group) ||
      (a.pin || Infinity) - (b.pin || Infinity) || b.scale - a.scale || b.year - a.year ||
      a.title.localeCompare(b.title);
  });
  var groups = [["Me", me]];
  GROUP_ORDER.forEach(function (g) {
    groups.push([GROUP_NAMES[g], live.filter(function (p) { return p.group === g; })]);
  });

  var grid = document.getElementById("grid");
  groups.forEach(function (group) {
    var head = document.createElement("div");
    head.className = "group";
    head.textContent = group[0];
    grid.appendChild(head);
    group[1].forEach(function (p) {
      var pair = document.createElement("div");
      pair.className = "pair";
      pair.innerHTML =
        '<div class="tile line"><img src="../tiles/' + themed(p.line || p.id + ".svg") + '" alt=""></div>' +
        '<div class="tile"><img src="../tiles/' + themed(p.image || p.id + ".jpg") + '" alt=""></div>' +
        "<p>" + p.tile + "</p>";
      grid.appendChild(pair);
    });
  });
</script>
</body>
</html>
